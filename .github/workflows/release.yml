name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn build:icons

      - uses: actions/upload-artifact@v4
        with:
          name: icons
          path: |
            electron/resources/icons
            electron/src/renderer/public/favicon.svg
            electron/src/renderer/public/favicon.ico
          if-no-files-found: error
          retention-days: 1

  release-mac:
    needs: generate-icons
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: icons
          path: electron

      - run: yarn build:code

      - run: yarn workspace sortie-desktop run dist:mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-mac
          path: electron/out/*.dmg
          if-no-files-found: warn

  release-windows:
    needs: generate-icons
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: icons
          path: electron

      - run: yarn build:code

      - run: yarn workspace sortie-desktop run dist:win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-windows
          path: electron/out/*.exe
          if-no-files-found: warn

  release-linux:
    needs: generate-icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install Linux build deps for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            libnss3 \
            libxss1

      - run: yarn install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: icons
          path: electron

      - run: yarn build:code

      - run: yarn workspace sortie-desktop run dist:linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-linux
          path: |
            electron/out/*.AppImage
            electron/out/*.deb
          if-no-files-found: warn
