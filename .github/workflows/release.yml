name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-icons:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn build:icons

      - uses: actions/upload-artifact@v4
        with:
          name: icons
          path: |
            electron/resources/icons
            electron/src/renderer/public/favicon.svg
            electron/src/renderer/public/favicon.ico
          if-no-files-found: error
          retention-days: 1

  release-mac-arm:
    needs: generate-icons
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: icons
          path: electron

      - run: yarn build:code

      - run: yarn workspace sortie-desktop run dist:mac --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-mac-arm64
          path: electron/out/*.dmg
          if-no-files-found: warn

      - name: Upload unpacked mac build for itch.io
        uses: actions/upload-artifact@v4
        with:
          name: itch-mac-arm64
          path: electron/out/mac-arm64
          if-no-files-found: error
          retention-days: 1

  release-mac-intel:
    needs: generate-icons
    runs-on: macos-13
    # macos-13 (Intel) runners are scarce and frequently time out waiting for
    # allocation. publish-itch runs with `if: !cancelled()` and per-channel
    # gating so a stalled Intel run doesn't block the other channels.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: icons
          path: electron

      - run: yarn build:code

      - run: yarn workspace sortie-desktop run dist:mac --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-mac-x64
          path: electron/out/*.dmg
          if-no-files-found: warn

      - name: Upload unpacked mac build for itch.io
        uses: actions/upload-artifact@v4
        with:
          name: itch-mac-x64
          path: electron/out/mac
          if-no-files-found: error
          retention-days: 1

  release-windows:
    needs: generate-icons
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: icons
          path: electron

      - run: yarn build:code

      - run: yarn workspace sortie-desktop run dist:win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-windows
          path: electron/out/*.exe
          if-no-files-found: warn

      - name: Upload unpacked windows build for itch.io
        uses: actions/upload-artifact@v4
        with:
          name: itch-windows
          path: electron/out/win-unpacked
          if-no-files-found: error
          retention-days: 1

  release-linux:
    needs: generate-icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install Linux build deps for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            libnss3 \
            libxss1

      - run: yarn install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: icons
          path: electron

      - run: yarn build:code

      - run: yarn workspace sortie-desktop run dist:linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-linux
          path: |
            electron/out/*.AppImage
            electron/out/*.deb
          if-no-files-found: warn

      - name: Upload unpacked linux build for itch.io
        uses: actions/upload-artifact@v4
        with:
          name: itch-linux
          path: electron/out/linux-unpacked
          if-no-files-found: error
          retention-days: 1

  publish-itch:
    needs: [release-mac-arm, release-mac-intel, release-windows, release-linux]
    # Run as long as the release wasn't manually cancelled. Each matrix entry
    # gates its own steps on its specific upstream job's result, so a stalled
    # macos-13 runner won't block arm64/Windows/Linux from publishing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      ITCH_USER: nighten
      ITCH_GAME: sortie
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: itch-mac-arm64
            channel: osx-arm64
            source: release-mac-arm
          - artifact: itch-mac-x64
            channel: osx-intel
            source: release-mac-intel
          - artifact: itch-windows
            channel: windows
            source: release-windows
          - artifact: itch-linux
            channel: linux
            source: release-linux
    steps:
      - name: Check upstream job status
        id: upstream
        run: |
          result="${{ needs[matrix.source].result }}"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [[ "$result" != "success" ]]; then
            echo "::warning::Upstream ${{ matrix.source }} did not succeed (result=$result); skipping ${{ matrix.channel }} push"
          fi

      - uses: actions/download-artifact@v4
        if: steps.upstream.outputs.result == 'success'
        with:
          name: ${{ matrix.artifact }}
          path: ./build

      - name: Install butler
        if: steps.upstream.outputs.result == 'success'
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -o butler.zip
          chmod +x butler
          ./butler -V

      - name: Derive version from tag
        id: version
        if: steps.upstream.outputs.result == 'success'
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Push build to itch.io
        if: steps.upstream.outputs.result == 'success'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler push \
            ./build \
            "${ITCH_USER}/${ITCH_GAME}:${{ matrix.channel }}" \
            --userversion "${{ steps.version.outputs.value }}"
